<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kirish · FutbolGo Panel</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 flex items-center justify-center px-4">
  <div class="w-full max-w-sm">
    <div class="text-center mb-8">
      <div class="h-12 w-12 rounded-xl bg-emerald-500 mx-auto flex items-center justify-center font-bold text-white text-xl">F</div>
      <h1 class="mt-4 text-white text-xl font-semibold">FutbolGo Admin Panel</h1>
      <p class="text-slate-500 text-sm mt-1">Faqat adminlar uchun</p>
    </div>

    <form method="post" class="bg-slate-900 border border-white/10 rounded-2xl p-6 space-y-4">
      {% csrf_token %}
      {% if error %}
      <div class="rounded-lg bg-red-500/10 border border-red-500/30 text-red-400 text-sm px-3 py-2">{{ error }}</div>
      {% endif %}
      <div>
        <label class="block text-xs text-slate-400 mb-1">Telefon raqam</label>
        <input type="text" name="phone" placeholder="+998901234567" required autofocus
          class="w-full rounded-lg bg-slate-800 border border-white/10 text-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Parol</label>
        <input type="password" name="password" required
          class="w-full rounded-lg bg-slate-800 border border-white/10 text-white px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      </div>
      <button type="submit" class="w-full rounded-lg bg-emerald-500 hover:bg-emerald-400 text-white font-medium py-2.5 text-sm transition">
        Kirish
      </button>
    </form>
  </div>
</body>
</html>
